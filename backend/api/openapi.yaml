openapi: 3.0.3
info:
  title: SIRCCD API
  description: |
    API REST para el Sistema Inteligente Urbano para Reporte y Priorización de Daños Viales.
    
    Permite gestionar reportes ciudadanos, clasificación automática mediante IA, 
    deduplicación, priorización multicriterio y gestión operativa municipal.
  version: 1.0.0
  contact:
    name: Equipo SIRCCD
    email: soporte@sirccd.gob.sv

servers:
  - url: http://localhost:8000/api/v1
    description: Desarrollo local
  - url: https://api.sirccd.gob.sv/api/v1
    description: Producción

tags:
  - name: auth
    description: Autenticación y autorización
  - name: reportes
    description: Reportes ciudadanos de daños viales
  - name: incidentes
    description: Incidentes validados y gestionados
  - name: prioridad
    description: Cálculo y consulta de priorización
  - name: metrics
    description: KPIs y métricas del sistema

paths:
  # ==========================================
  # AUTH - Autenticación
  # ==========================================
  /auth/login:
    post:
      tags:
        - auth
      summary: Iniciar sesión
      description: Autenticación de usuario (ciudadano, supervisor, administrador)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags:
        - auth
      summary: Renovar token de acceso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token renovado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - auth
      summary: Cerrar sesión
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada exitosamente
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # REPORTES - Gestión de reportes ciudadanos
  # ==========================================
  /reportes:
    get:
      tags:
        - reportes
      summary: Listar reportes
      description: Obtiene lista de reportes con filtros opcionales
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: estado
          in: query
          schema:
            type: string
            enum: [pendiente, procesando, validado, rechazado, duplicado]
        - name: tipo_dano
          in: query
          schema:
            type: string
            enum: [bache, grieta, hundimiento]
        - name: fecha_desde
          in: query
          schema:
            type: string
            format: date
        - name: fecha_hasta
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de reportes
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 150
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reporte'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - reportes
      summary: Crear nuevo reporte
      description: Crea un reporte ciudadano con foto y geolocalización
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imagen
                - latitud
                - longitud
              properties:
                imagen:
                  type: string
                  format: binary
                  description: Foto del daño vial
                latitud:
                  type: number
                  format: double
                  example: 13.692940
                longitud:
                  type: number
                  format: double
                  example: -89.218191
                descripcion:
                  type: string
                  example: Bache grande en entrada de colonia
                direccion:
                  type: string
                  example: Calle Principal, Col. Escalón
      responses:
        '201':
          description: Reporte creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /reportes/{id}:
    get:
      tags:
        - reportes
      summary: Obtener reporte por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalles del reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - reportes
      summary: Actualizar estado del reporte
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  enum: [pendiente, procesando, validado, rechazado, duplicado]
                observaciones:
                  type: string
      responses:
        '200':
          description: Reporte actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # INCIDENTES - Gestión de incidentes validados
  # ==========================================
  /incidentes:
    get:
      tags:
        - incidentes
      summary: Listar incidentes
      description: Obtiene incidentes validados con filtros y ordenamiento
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: estado_operativo
          in: query
          schema:
            type: string
            enum: [pendiente, en_proceso, resuelto, cerrado]
        - name: prioridad
          in: query
          schema:
            type: string
            enum: [critica, alta, media, baja]
        - name: tipo_dano
          in: query
          schema:
            type: string
            enum: [bache, grieta, hundimiento]
        - name: orden
          in: query
          schema:
            type: string
            enum: [prioridad_desc, fecha_asc, severidad_desc]
            default: prioridad_desc
      responses:
        '200':
          description: Lista de incidentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incidente'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /incidentes/{id}:
    get:
      tags:
        - incidentes
      summary: Obtener incidente por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalles del incidente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incidente'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - incidentes
      summary: Actualizar incidente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado_operativo:
                  type: string
                  enum: [pendiente, en_proceso, resuelto, cerrado]
                notas_resolucion:
                  type: string
      responses:
        '200':
          description: Incidente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incidente'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # PRIORIDAD - Cálculo de priorización
  # ==========================================
  /prioridad/calcular:
    post:
      tags:
        - prioridad
      summary: Calcular prioridad de incidente
      description: |
        Calcula la prioridad multicriterio basada en:
        - Severidad del daño (área/longitud)
        - Riesgo (proximidad a POIs críticos)
        - Antigüedad del reporte
        - Densidad de reportes en la zona
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - incidente_id
              properties:
                incidente_id:
                  type: string
                  format: uuid
                forzar_recalculo:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Prioridad calculada
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidente_id:
                    type: string
                    format: uuid
                  prioridad:
                    type: string
                    enum: [critica, alta, media, baja]
                  score:
                    type: number
                    format: float
                    example: 0.85
                  factores:
                    type: object
                    properties:
                      severidad_score:
                        type: number
                      riesgo_score:
                        type: number
                      antigüedad_score:
                        type: number
                      densidad_score:
                        type: number

  /prioridad/ranking:
    get:
      tags:
        - prioridad
      summary: Obtener ranking de prioridades
      description: Lista de incidentes ordenados por prioridad descendente
      security:
        - bearerAuth: []
      parameters:
        - name: limite
          in: query
          schema:
            type: integer
            default: 50
        - name: solo_pendientes
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Ranking de incidentes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    posicion:
                      type: integer
                    incidente:
                      $ref: '#/components/schemas/Incidente'
                    prioridad_score:
                      type: number

  # ==========================================
  # METRICS - KPIs y métricas
  # ==========================================
  /metrics/dashboard:
    get:
      tags:
        - metrics
      summary: KPIs del dashboard municipal
      security:
        - bearerAuth: []
      parameters:
        - name: periodo
          in: query
          schema:
            type: string
            enum: [dia, semana, mes, año]
            default: mes
      responses:
        '200':
          description: Métricas generales del sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportes_totales:
                    type: integer
                    example: 1523
                  incidentes_activos:
                    type: integer
                    example: 342
                  incidentes_resueltos:
                    type: integer
                    example: 1181
                  tasa_duplicados:
                    type: number
                    format: float
                    example: 0.23
                  tiempo_respuesta_promedio:
                    type: number
                    description: En horas
                    example: 48.5
                  distribucion_tipos:
                    type: object
                    properties:
                      bache:
                        type: integer
                      grieta:
                        type: integer
                      hundimiento:
                        type: integer
                  sla_cumplimiento:
                    type: number
                    format: float
                    example: 0.87

  /metrics/modelo:
    get:
      tags:
        - metrics
      summary: Métricas del modelo ML
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métricas de rendimiento del modelo
          content:
            application/json:
              schema:
                type: object
                properties:
                  clasificacion:
                    type: object
                    properties:
                      f1_score:
                        type: number
                        example: 0.92
                      precision:
                        type: number
                        example: 0.94
                      recall:
                        type: number
                        example: 0.90
                      accuracy:
                        type: number
                        example: 0.93
                  deduplicacion:
                    type: object
                    properties:
                      tasa_deteccion:
                        type: number
                        example: 0.89
                      falsos_positivos:
                        type: number
                        example: 0.05
                  inferencia:
                    type: object
                    properties:
                      tiempo_promedio_ms:
                        type: number
                        example: 245.5
                      throughput_imagenes_segundo:
                        type: number
                        example: 4.2

  /metrics/geograficos:
    get:
      tags:
        - metrics
      summary: Métricas geográficas
      description: Distribución geográfica de incidentes
      security:
        - bearerAuth: []
      parameters:
        - name: tipo_agregacion
          in: query
          schema:
            type: string
            enum: [barrio, distrito, zona]
            default: barrio
      responses:
        '200':
          description: Mapa de calor de incidentes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    zona:
                      type: string
                    cantidad:
                      type: integer
                    prioridad_promedio:
                      type: number
                    coordenadas:
                      type: object
                      properties:
                        lat:
                          type: number
                        lng:
                          type: number

# ==========================================
# COMPONENTES REUTILIZABLES
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre:
          type: string
        rol:
          type: string
          enum: [ciudadano, administrador, supervisor]
        activo:
          type: boolean

    Reporte:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usuario_id:
          type: string
          format: uuid
        imagen_url:
          type: string
          format: uri
        imagen_procesada_url:
          type: string
          format: uri
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double
        direccion:
          type: string
        descripcion:
          type: string
        tipo_dano:
          type: string
          enum: [bache, grieta, hundimiento]
          nullable: true
        confianza_clasificacion:
          type: number
          format: float
          nullable: true
        severidad:
          type: number
          format: float
          nullable: true
        estado:
          type: string
          enum: [pendiente, procesando, validado, rechazado, duplicado]
        es_duplicado:
          type: boolean
        duplicado_de:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Incidente:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporte_id:
          type: string
          format: uuid
        tipo_dano:
          type: string
          enum: [bache, grieta, hundimiento]
        severidad:
          type: number
          format: float
        prioridad:
          type: string
          enum: [critica, alta, media, baja]
        prioridad_score:
          type: number
          format: float
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double
        direccion:
          type: string
        estado_operativo:
          type: string
          enum: [pendiente, en_proceso, resuelto, cerrado]
        fecha_resolucion:
          type: string
          format: date-time
          nullable: true
        tiempo_resolucion_horas:
          type: number
          nullable: true
        notas_resolucion:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: La solicitud no cumple con los requisitos

    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: Token de autenticación inválido o expirado

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: El recurso solicitado no existe

    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
          example:
            error: validation_error
            message: Los datos proporcionados no son válidos
            details:
              - field: email
                message: Formato de email inválido
              - field: password
                message: La contraseña debe tener al menos 8 caracteres

security:
  - bearerAuth: []
