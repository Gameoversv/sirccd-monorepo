version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sirccd-postgres
    environment:
      POSTGRES_USER: sirccd_user
      POSTGRES_PASSWORD: sirccd_password
      POSTGRES_DB: sirccd_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirccd_user -d sirccd_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sirccd-network

  redis:
    image: redis:7-alpine
    container_name: sirccd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sirccd-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sirccd-network:
    driver: bridge
