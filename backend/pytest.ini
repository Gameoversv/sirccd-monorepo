[pytest]
# ==========================================
# Configuración de Pytest (B-11)
# ==========================================

# Directorio base de tests
testpaths = tests

# Patrón para descubrir archivos de test
python_files = test_*.py *_test.py

# Patrón para clases de test
python_classes = Test*

# Patrón para funciones de test
python_functions = test_*

# ==========================================
# Markers Personalizados
# ==========================================

markers =
    unit: Tests unitarios aislados
    integration: Tests de integración
    contract: Tests de contrato/esquema
    slow: Tests lentos (>1 segundo)
    auth: Tests relacionados con autenticación
    reports: Tests relacionados con reportes
    incidents: Tests relacionados con incidentes
    ml: Tests relacionados con ML/IA
    db: Tests que requieren base de datos

# ==========================================
# Opciones de Ejecución
# ==========================================

# Mostrar output de print() incluso en tests exitosos
addopts =
    # Verbose output
    -v
    # Mostrar resumen de tests
    -ra
    # Mostrar warnings
    --strict-markers
    # No capturar output para mejor debugging
    -s
    # Mostrar información adicional en fallos
    --tb=short
    # Paralelización (comentar si causa problemas)
    # --numprocesses=auto
    # Detener en primer fallo (útil para debugging)
    # -x

# ==========================================
# Configuración de Asyncio
# ==========================================

# Modo de asyncio para pytest-asyncio
asyncio_mode = auto

# ==========================================
# Configuración de Warnings
# ==========================================

# Filtros de warnings
filterwarnings =
    # Ignorar deprecation warnings de librerías externas
    ignore::DeprecationWarning
    # Mostrar warnings de nuestra aplicación
    default::DeprecationWarning:main.*
    default::DeprecationWarning:api.*
    default::DeprecationWarning:services.*
    # Ignorar warnings específicos conocidos
    ignore:.*datetime\.datetime\.utcnow.*:DeprecationWarning

# ==========================================
# Variables de Entorno
# ==========================================

# Configurar variables de entorno para tests
env =
    TESTING=true
    DATABASE_URL=sqlite:///:memory:
    SECRET_KEY=test_secret_key_for_jwt_tokens
    ALGORITHM=HS256
    ACCESS_TOKEN_EXPIRE_MINUTES=30

# ==========================================
# Timeouts
# ==========================================

# Timeout global para tests (en segundos)
# timeout = 300

# No aplicar timeout a tests marcados como @pytest.mark.slow
# timeout_func_only = true

# ==========================================
# Logging
# ==========================================

# Nivel de logging durante tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Log file
log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ==========================================
# Colección de Tests
# ==========================================

# No colectar archivos en estos directorios
norecursedirs =
    .git
    .tox
    .env
    .venv
    tests/manual
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    htmlcov
    .coverage
    node_modules

# ==========================================
# Configuración de Coverage
# ==========================================

# Ver .coveragerc para configuración detallada de coverage
