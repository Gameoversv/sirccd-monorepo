# S-03 — Compose de PRODUCCIÓN con TLS, SSE y Redis autenticado.
# Diferencias vs docker-compose.yml (dev):
#   - Nginx reverse proxy con TLS 1.2/1.3
#   - MinIO en modo HTTPS (MINIO_SECURE=true) + SSE-S3 habilitado
#   - Bucket sirccd-images SIN acceso público anónimo
#   - Redis con contraseña obligatoria
#   - Secretos inyectados como variables de entorno (no hardcodeados)
#   - CORS limitado a orígenes HTTPS
#
# Antes de usar:
#   1. Generar certificados TLS: ./infra/nginx/generate-dev-certs.sh (o usar Let's Encrypt)
#   2. Copiar .env.example → .env y rellenar TODOS los secretos
#   3. docker compose -f docker-compose.prod.yml up -d

version: '3.8'

services:

  # ── TLS Termination ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: sirccd-nginx
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"  # MinIO Console HTTPS
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - sirccd-network

  # ── Infraestructura ───────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sirccd-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sirccd-network
    # Puerto NO expuesto al host — solo accesible dentro de la red Docker

  redis:
    image: redis:7-alpine
    container_name: sirccd-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sirccd-network

  minio:
    image: minio/minio:latest
    container_name: sirccd-minio
    # Puertos NO expuestos al host — acceso solo via nginx:9443
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # Habilitar SSE-S3 como política por defecto
      MINIO_KMS_AUTO_ENCRYPTION: "on"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sirccd-network

  minio-init:
    image: minio/mc:latest
    container_name: sirccd-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb --ignore-existing local/sirccd-images &&
      mc mb --ignore-existing local/sirccd-models &&
      mc encrypt set sse-s3 local/sirccd-images &&
      mc encrypt set sse-s3 local/sirccd-models &&
      echo 'S-03: SSE-S3 activado en buckets de produccion'
      "
    networks:
      - sirccd-network
    restart: on-failure

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sirccd-backend
    # Sin exposición directa — tráfico solo via Nginx
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "False"       # HTTP interno Docker; TLS termina en Nginx
      MINIO_SSE_ENABLED: "True"   # S-03: cifrado en reposo
      MINIO_BUCKET_IMAGES: sirccd-images
      MINIO_BUCKET_MODELS: sirccd-models
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY}
      ROBOFLOW_MODEL_ID: ${ROBOFLOW_MODEL_ID}
      CONFIDENCE_THRESHOLD: "0.4"
      IOU_THRESHOLD: "0.4"
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}   # S-03: cifrado en BD
      ALLOWED_ORIGINS: '["https://${DOMAIN}","https://www.${DOMAIN}"]'
      LOG_LEVEL: "INFO"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
      - torch_cache:/root/.cache/torch
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - sirccd-network

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sirccd-frontend
    environment:
      NEXT_PUBLIC_API_URL: "https://${DOMAIN}/api/v1"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sirccd-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_storage:
  backend_logs:
  torch_cache:
  hf_cache:

networks:
  sirccd-network:
    driver: bridge
