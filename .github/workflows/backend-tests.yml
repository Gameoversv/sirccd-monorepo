name: Backend Tests (B-11)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  # ==========================================
  # Tests Unitarios y de Integración
  # ==========================================
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    services:
      # PostgreSQL para tests de integración
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: sirccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      # Redis para tests de cola
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
      
      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test:testpass@localhost:5432/sirccd_test
        run: |
          alembic upgrade head || echo "No migrations to run"
      
      - name: Run unit tests
        working-directory: ./backend
        env:
          TESTING: true
          DATABASE_URL: postgresql://test:testpass@localhost:5432/sirccd_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_for_ci
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          pytest tests/ -m "unit" --cov --cov-report=xml --cov-report=term
      
      - name: Run integration tests
        working-directory: ./backend
        env:
          TESTING: true
          DATABASE_URL: postgresql://test:testpass@localhost:5432/sirccd_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_for_ci
        run: |
          pytest tests/ -m "integration" --cov --cov-report=xml --cov-append
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend-unit
          name: backend-unit-${{ matrix.python-version }}
  
  # ==========================================
  # Tests de Contrato (Schemathesis)
  # ==========================================
  contract-tests:
    name: Contract Tests (OpenAPI)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: sirccd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run contract tests
        working-directory: ./backend
        env:
          TESTING: true
          DATABASE_URL: postgresql://test:testpass@localhost:5432/sirccd_test
          SECRET_KEY: test_secret_key_for_ci
        run: |
          pytest tests/test_contract.py -m "contract" -v
      
      - name: Validate OpenAPI schema
        working-directory: ./backend
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator api/openapi.yaml || echo "Schema validation skipped"
  
  # ==========================================
  # Análisis de Código
  # ==========================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort bandit safety
      
      - name: Run Black (code formatting)
        working-directory: ./backend
        run: |
          black --check . || echo "Black formatting check failed"
      
      - name: Run isort (import ordering)
        working-directory: ./backend
        run: |
          isort --check-only . || echo "isort check failed"
      
      - name: Run Flake8 (linting)
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Flake8 check failed"
      
      - name: Run Pylint
        working-directory: ./backend
        run: |
          pylint --exit-zero api/ services/ models/ core/ || echo "Pylint check completed"
      
      - name: Run Bandit (security)
        working-directory: ./backend
        run: |
          bandit -r . -ll || echo "Bandit security check failed"
      
      - name: Check dependencies for vulnerabilities
        working-directory: ./backend
        run: |
          safety check --json || echo "Safety check failed"
  
  # ==========================================
  # Reporte Final
  # ==========================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, contract-tests, code-quality]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Contract Tests: ${{ needs.contract-tests.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          
          if [ "${{ needs.contract-tests.result }}" != "success" ]; then
            echo "⚠️ Contract tests failed"
          fi
          
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "⚠️ Code quality checks failed"
          fi
          
          echo "✅ All critical tests passed!"
