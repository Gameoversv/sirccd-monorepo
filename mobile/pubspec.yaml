name: sirccd_mobile
description: "SIRCCD — Sistema Inteligente de Reporte y Control de Daños Viales. App ciudadana."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.3

  # HTTP client
  dio: ^5.8.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Runtime permissions
  permission_handler: ^11.3.1

  # Camera
  camera: ^0.11.1

  # GPS / location metadata
  geolocator: ^13.0.1

  # Offline-first storage
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4

  # Image picker (camera + gallery)
  image_picker: ^1.1.2

  # Map preview
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
