version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: sirccd-minio
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console
    environment:
      MINIO_ROOT_USER: sirccd_admin
      MINIO_ROOT_PASSWORD: sirccd_password_2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sirccd-network

volumes:
  minio_data:
    driver: local

networks:
  sirccd-network:
    driver: bridge
